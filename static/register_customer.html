<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Customer | CRE BANK</title><link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="stylesheet" href="css/style.css"></head><body>
<div id="page">
  <h1 class="title">Register Customer</h1>
  <p class="sub">Enter the customer's details to open an account</p>
  <div id="msg"></div>
  <div class="card form">
    <form id="f" autocomplete="off">
      <input type="text" name="full_name" placeholder="Full name" required>
      <input type="text" name="phone" placeholder="Phone number" required>
      <input type="text" name="address" placeholder="Address" required>
      <label>Date of birth</label>
      <input type="date" name="dob" required>
      <input type="text" name="id_number" placeholder="ID number" required>
      <select name="account_type"><option value="savings">Savings account</option><option value="current">Current account</option></select>
      <button type="submit">Register Customer</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
App.init({title: 'New Customer'}).then(() => {
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, msg = document.getElementById('msg');
    try {
      const d = await App.api('register_customer.php', Object.fromEntries(new FormData(f)));
      App.alertBox(msg, 'ok', 'Customer registered. Account number: <b>' + App.esc(d.account_number) + '</b>');
      f.reset();
    } catch (err) { App.alertBox(msg, 'err', App.esc(err.message)); }
  });
}).catch(App.onError);
</script></body></html>
