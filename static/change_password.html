<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password | CRE BANK</title><link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="stylesheet" href="css/style.css"></head><body>
<div id="page">
  <h1 class="title">Change Password</h1>
  <p class="sub">Choose a strong password that only you know.</p>
  <div id="msg"></div>
  <div class="card form">
    <form id="f" autocomplete="off">
      <label>Current password</label>
      <input type="password" name="current" autocomplete="current-password" required>
      <label>New password</label>
      <input type="password" name="new" autocomplete="new-password" required>
      <label>Confirm new password</label>
      <input type="password" name="confirm" autocomplete="new-password" required>
      <button type="submit">Update Password</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
App.init({title: 'Change Password'}).then(() => {
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, msg = document.getElementById('msg');
    try {
      await App.api('change_password.php', Object.fromEntries(new FormData(f)));
      App.alertBox(msg, 'ok', 'Password changed successfully.');
      f.reset();
    } catch (err) { App.alertBox(msg, 'err', App.esc(err.message)); }
  });
}).catch(App.onError);
</script></body></html>
