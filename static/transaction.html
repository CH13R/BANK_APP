<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deposit / Withdraw | CRE BANK</title><link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="stylesheet" href="css/style.css"></head><body>
<div id="page">
  <h1 class="title">Deposit / Withdraw</h1>
  <p class="sub">Update a customer's account balance</p>
  <div id="msg"></div>
  <div class="card form">
    <form id="f" autocomplete="off">
      <input type="text" name="account_number" placeholder="Account number" required>
      <select name="type"><option value="deposit">Deposit</option><option value="withdrawal">Withdrawal</option></select>
      <input type="number" name="amount" placeholder="Amount" step="0.01" min="0.01" required>
      <button type="submit">Submit Transaction</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
App.init({title: 'Deposit / Withdraw'}).then(() => {
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, msg = document.getElementById('msg');
    try {
      const d = await App.api('transaction.php', Object.fromEntries(new FormData(f)));
      const label = d.type.charAt(0).toUpperCase() + d.type.slice(1);
      App.alertBox(msg, 'ok', label + ' successful. New balance: <b>' + App.money(d.balance) + '</b>');
      f.reset();
    } catch (err) { App.alertBox(msg, 'err', App.esc(err.message)); }
  });
}).catch(App.onError);
</script></body></html>
